<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'; manifest-src 'self'">
  <!-- Documentação: o cabeçalho X-Frame-Options real é enviado pelo .htaccess -->
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
  <meta name="description" content="Eventos da comunidade furry na Little Paw Coffee: noites de arte, degustações, encontros e workshops.">
  <meta name="theme-color" content="#5C2D0E">
  <title data-i18n="events.docTitle">Eventos — Little Paw Coffee</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/accessibility.css">
  <script defer src="assets/js/security.js"></script>
  <script defer src="assets/js/i18n.js"></script>
  <script defer src="assets/js/lgpd.js"></script>
  <script defer src="assets/js/data.js"></script>
  <script defer src="assets/js/cart.js"></script>
  <script defer src="assets/js/layout.js"></script>
  <script defer src="assets/js/pages/events.js"></script>
  <script defer src="assets/js/main.js"></script>
</head>
<body data-page="events" data-title-key="events.docTitle">
  <a class="skip-link" href="#main" data-i18n="skip">Pular para o conteúdo principal</a>
  <header id="site-header" class="site-header"></header>
  <noscript><p class="noscript-note">Este site precisa de JavaScript para exibir os eventos e as inscrições.</p></noscript>

  <main id="main" tabindex="-1">
    <section class="page-hero paw-bg" aria-labelledby="page-title">
      <div class="container">
        <h1 id="page-title" data-i18n="events.title">Eventos da Comunidade</h1>
        <p class="page-hero__intro" data-i18n="events.intro"></p>
      </div>
    </section>

    <div class="container events-layout">
      <section class="events-list" id="events-list" aria-labelledby="page-title"></section>

      <aside class="events-aside">
        <form class="form form-card" id="rsvp-form" novalidate aria-labelledby="rsvp-title">
          <h2 id="rsvp-title" class="form-card__title"><span aria-hidden="true">🎟️</span> <span data-i18n="events.form.title">Inscrição em Evento</span></h2>
          <div class="form-field">
            <label for="rsvp-name" data-i18n="events.form.name">Nome ou apelido furry</label>
            <input type="text" id="rsvp-name" name="name" maxlength="60" minlength="2" required autocomplete="nickname">
          </div>
          <div class="form-field">
            <label for="rsvp-email" data-i18n="events.form.email">E-mail</label>
            <input type="email" id="rsvp-email" name="email" maxlength="254" required autocomplete="email" inputmode="email">
          </div>
          <div class="form-field">
            <label for="rsvp-event" data-i18n="events.form.event">Evento</label>
            <select id="rsvp-event" name="event" required></select>
          </div>
          <div class="form-check">
            <input type="checkbox" id="rsvp-consent" name="consent" required>
            <label for="rsvp-consent" data-i18n="events.form.consent">Concordo que meus dados fiquem armazenados somente neste navegador.</label>
          </div>
          <button type="submit" class="btn btn--primary btn--block" data-i18n="events.form.submit">Confirmar inscrição</button>
          <p class="notice notice--small" role="note"><span aria-hidden="true">🛡️</span> <span data-i18n="events.lgpd"></span></p>
        </form>

        <section class="form-card" aria-labelledby="my-rsvps-title">
          <h2 id="my-rsvps-title" class="form-card__title"><span aria-hidden="true">🐾</span> <span data-i18n="events.my">Minhas inscrições</span></h2>
          <div id="my-rsvps" aria-live="polite"></div>
        </section>
      </aside>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
